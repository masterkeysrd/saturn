version: v2
modules:
   - path: api
     name: buf.build/masterkeysrd/saturn
     breaking:
       use:
         - FILE
     lint:
      use:
        - STANDARD
        - COMMENTS
      except:
        - ENUM_VALUE_PREFIX
        - RPC_REQUEST_RESPONSE_UNIQUE
        - RPC_RESPONSE_STANDARD_NAME
        - SERVICE_SUFFIX
deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
