  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Owning workspace identifier (`spc_...`).
  string space_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Built-in system blueprint key (e.g. 'system.saturn.mcp').
  optional string system_key = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether this is a protected built-in system server.
  bool is_system = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. URL-safe slug used for tool namespacing.
  string slug = 5 [(google.api.field_behavior) = REQUIRED];

  // Required. Human-readable server name.
  string name = 6 [(google.api.field_behavior) = REQUIRED];

  // Optional. Description of capabilities provided by this server.
  string description = 7 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Transport protocol ('http' or 'in_memory' for system server).
  string transport = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Server connection and trust configuration.
  optional MCPServerConfig config = 9 [(google.api.field_behavior) = REQUIRED];

  // Output only. Whether encrypted auth credentials are stored for this server.
  bool has_auth_secret = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Discovery state and available tools.
  optional MCPDiscoveryState discovery = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Whether this MCP server is enabled.
  bool is_enabled = 12 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Creation timestamp.
  google.protobuf.Timestamp create_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Last update timestamp.
  google.protobuf.Timestamp update_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Input only. Write-only authentication secret encrypted at rest and never returned on reads.
  optional MCPAuthSecretInput auth_secret = 15 [(google.api.field_behavior) = INPUT_ONLY];
}

// ExecutionConfig controls runtime limits and tool approval behavior for an agent.
message ExecutionConfig {
  // Optional. Tool approval policy ('confirm_writes', 'auto', 'deny_writes').
  string approval_policy = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Maximum ReAct tool/LLM iterations per run.
  int32 max_steps = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Execution timeout in seconds.
