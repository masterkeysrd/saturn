  // Output only. Incremental text or thinking delta string.
  optional string delta = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Tool call correlation ID for tool lifecycle events.
  optional string tool_call_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Tool name for tool lifecycle events.
  optional string tool_name = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. MCP server identifier (`mcp_...`) for tool lifecycle events.
  optional string mcp_server_id = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Tool call input arguments.
  optional google.protobuf.Struct arguments = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Tool call output payload.
  optional google.protobuf.Struct result = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether a completed tool call resulted in an error.
