  // Optional. Workspace model role ('default', 'fast', 'reasoning') when model_id is unset.
  optional string role = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Generation and thinking configuration overrides.
  optional GenerationConfig generation = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. JSON Schema enforcing structured output.
  optional google.protobuf.Struct output_schema = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Optional inline file attachments.
  repeated TurnAttachment attachments = 7 [(google.api.field_behavior) = OPTIONAL];
}

