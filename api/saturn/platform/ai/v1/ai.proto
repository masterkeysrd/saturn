  // Output only. Terminal run output.
  optional RunOutput output = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Structured error detail if the run failed.
  optional ErrorDetail error = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Aggregated token, cost, and latency metrics.
