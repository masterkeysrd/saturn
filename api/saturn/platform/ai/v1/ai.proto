  string type = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Thread identifier (`thr_...`).
  optional string thread_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Active run identifier (`air_...`).
  optional string run_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Message identifier (`aim_...`) when applicable.
