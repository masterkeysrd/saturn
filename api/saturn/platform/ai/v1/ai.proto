syntax = "proto3";

package saturn.platform.ai.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/masterkeysrd/saturn/apis/saturn/platform/ai/v1;aiv1";

// AIService manages workspace AI settings, LLM providers, model registry,
// unified MCP servers, autonomous agents, private streaming chat threads,
// headless text/structured generation, and execution observability.
service AIService {
  // Retrieves workspace AI settings including model role defaults, governance, and current monthly spend.
  rpc GetSettings(GetSettingsRequest) returns (Settings) {
    option (google.api.http) = {get: "/v1/platform/ai/settings"};
  }

  // Updates workspace AI settings using a field mask.
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings) {
    option (google.api.http) = {
      patch: "/v1/platform/ai/settings"
      body: "settings"
    };
    option (google.api.method_signature) = "settings,update_mask";
  }

  // Lists supported LLM provider driver descriptors and defaults.
  rpc ListProviderDescriptors(ListProviderDescriptorsRequest) returns (ListProviderDescriptorsResponse) {
    option (google.api.http) = {get: "/v1/platform/ai/provider-descriptors"};
  }

  // Lists all configured LLM providers in the workspace.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
    option (google.api.http) = {get: "/v1/platform/ai/providers"};
  }

  // Retrieves a single LLM provider configuration (secrets masked).
  rpc GetProvider(GetProviderRequest) returns (Provider) {
    option (google.api.http) = {get: "/v1/platform/ai/providers/{id}"};
    option (google.api.method_signature) = "id";
  }

  // Creates a new LLM provider connection and auto-seeds curated default models.
  rpc CreateProvider(CreateProviderRequest) returns (Provider) {
    option (google.api.http) = {
      post: "/v1/platform/ai/providers"
      body: "provider"
    };
    option (google.api.method_signature) = "provider";
  }

  // Updates an existing LLM provider configuration or rotates its secret using a field mask.
  rpc UpdateProvider(UpdateProviderRequest) returns (Provider) {
    option (google.api.http) = {
      patch: "/v1/platform/ai/providers/{id}"
      body: "provider"
    };
    option (google.api.method_signature) = "id,provider,update_mask";
  }

  // Deletes an LLM provider connection and its associated models.
  rpc DeleteProvider(DeleteProviderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/platform/ai/providers/{id}"};
    option (google.api.method_signature) = "id";
  }

  // Verifies connectivity and credentials for an LLM provider and updates its status.
  rpc TestProvider(TestProviderRequest) returns (Provider) {
    option (google.api.http) = {
      post: "/v1/platform/ai/providers/{id}:test"
      body: "*"
    };
    option (google.api.method_signature) = "id";
  }

  // Discovers available upstream models for an LLM provider.
  rpc DiscoverProviderModels(DiscoverProviderModelsRequest) returns (DiscoverProviderModelsResponse) {
    option (google.api.http) = {get: "/v1/platform/ai/providers/{id}:discoverModels"};
    option (google.api.method_signature) = "id";
  }

  // Synchronizes upstream catalog or discovered models into the workspace model registry.
  rpc SyncProviderModels(SyncProviderModelsRequest) returns (SyncProviderModelsResponse) {
    option (google.api.http) = {
      post: "/v1/platform/ai/providers/{id}:syncModels"
      body: "*"
    };
    option (google.api.method_signature) = "id";
  }

  // Lists registered AI models in the workspace.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option (google.api.http) = {get: "/v1/platform/ai/models"};
  }

  // Retrieves a single registered AI model.
  rpc GetModel(GetModelRequest) returns (Model) {
    option (google.api.http) = {get: "/v1/platform/ai/models/{id}"};
    option (google.api.method_signature) = "id";
  }

  // Registers a custom or catalog AI model under a workspace provider.
  rpc CreateModel(CreateModelRequest) returns (Model) {
    option (google.api.http) = {
      post: "/v1/platform/ai/models"
      body: "model"
    };
    option (google.api.method_signature) = "model";
  }

  // Updates a registered AI model's display name, profile, config, or enabled state.
  rpc UpdateModel(UpdateModelRequest) returns (Model) {
    option (google.api.http) = {
      patch: "/v1/platform/ai/models/{id}"
      body: "model"
    };
    option (google.api.method_signature) = "id,model,update_mask";
  }

  // Deletes a registered AI model from the workspace.
  rpc DeleteModel(DeleteModelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/platform/ai/models/{id}"};
    option (google.api.method_signature) = "id";
  }

  // Lists unified MCP servers (including the lazily seeded built-in Saturn Workspace MCP).
  rpc ListMCPServers(ListMCPServersRequest) returns (ListMCPServersResponse) {
    option (google.api.http) = {get: "/v1/platform/ai/mcp-servers"};
  }

  // Retrieves a single MCP server configuration and live discovery state.
  rpc GetMCPServer(GetMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {get: "/v1/platform/ai/mcp-servers/{id}"};
    option (google.api.method_signature) = "id";
  }

  // Registers a remote HTTP MCP server in the workspace.
  rpc CreateMCPServer(CreateMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {
      post: "/v1/platform/ai/mcp-servers"
      body: "mcp_server"
    };
    option (google.api.method_signature) = "mcp_server";
  }

  // Updates an MCP server configuration or auth secret using a field mask.
  rpc UpdateMCPServer(UpdateMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {
      patch: "/v1/platform/ai/mcp-servers/{id}"
      body: "mcp_server"
    };
    option (google.api.method_signature) = "id,mcp_server,update_mask";
  }

  // Deletes a user-configured MCP server. System MCP servers cannot be deleted.
  rpc DeleteMCPServer(DeleteMCPServerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/platform/ai/mcp-servers/{id}"};
    option (google.api.method_signature) = "id";
  }

  // Tests connectivity to an MCP server and updates its discovery health status.
  rpc TestMCPServer(TestMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {
      post: "/v1/platform/ai/mcp-servers/{id}:test"
      body: "*"
    };
    option (google.api.method_signature) = "id";
  }

  // Synchronizes tools and server metadata from an MCP server.
  rpc SyncMCPServer(SyncMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {
      post: "/v1/platform/ai/mcp-servers/{id}:sync"
      body: "*"
    };
    option (google.api.method_signature) = "id";
  }

  // Lists AI agents in the workspace (lazily seeding the built-in Saturn Assistant).
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (google.api.http) = {get: "/v1/platform/ai/agents"};
  }

  // Retrieves a single AI agent by ID or system key.
  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.http) = {get: "/v1/platform/ai/agents/{id}"};
    option (google.api.method_signature) = "id";
  }

  // Creates a custom AI agent with optional MCP server bindings and output schema.
  rpc CreateAgent(CreateAgentRequest) returns (Agent) {
    option (google.api.http) = {
      post: "/v1/platform/ai/agents"
      body: "agent"
    };
    option (google.api.method_signature) = "agent";
  }

  // Updates an existing AI agent configuration using a field mask.
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent) {
    option (google.api.http) = {
      patch: "/v1/platform/ai/agents/{id}"
      body: "agent"
    };
    option (google.api.method_signature) = "id,agent,update_mask";
  }

  // Deletes a user-created AI agent. Built-in system agents cannot be deleted.
  rpc DeleteAgent(DeleteAgentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/platform/ai/agents/{id}"};
    option (google.api.method_signature) = "id";
  }

  // Resets a built-in system agent back to its factory blueprint defaults.
  rpc ResetAgent(ResetAgentRequest) returns (Agent) {
    option (google.api.http) = {
      post: "/v1/platform/ai/agents/{id}:reset"
      body: "*"
    };
    option (google.api.method_signature) = "id";
  }

  // Executes an agent headlessly in a multi-step MCP-enabled run.
  rpc ExecuteAgent(ExecuteAgentRequest) returns (Run) {
    option (google.api.http) = {
      post: "/v1/platform/ai/agents/{id}:execute"
      body: "*"
    };
    option (google.api.method_signature) = "id,prompt";
  }

  // Lists private chat threads belonging to the authenticated user in the workspace.
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse) {
    option (google.api.http) = {get: "/v1/platform/ai/threads"};
  }

  // Retrieves a private chat thread owned by the authenticated user.
  rpc GetThread(GetThreadRequest) returns (Thread) {
    option (google.api.http) = {get: "/v1/platform/ai/threads/{id}"};
    option (google.api.method_signature) = "id";
  }

  // Creates a new private chat thread (lazily seeding system AI defaults if needed).
  rpc CreateThread(CreateThreadRequest) returns (Thread) {
    option (google.api.http) = {
      post: "/v1/platform/ai/threads"
      body: "thread"
    };
    option (google.api.method_signature) = "thread";
  }

  // Updates a private chat thread (title, agent, model, pin/archive, config) using a field mask.
  rpc UpdateThread(UpdateThreadRequest) returns (Thread) {
    option (google.api.http) = {
      patch: "/v1/platform/ai/threads/{id}"
      body: "thread"
    };
    option (google.api.method_signature) = "id,thread,update_mask";
  }

  // Deletes a private chat thread and all of its messages.
  rpc DeleteThread(DeleteThreadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/platform/ai/threads/{id}"};
    option (google.api.method_signature) = "id";
  }

  // Lists persisted messages in a private chat thread ordered by sequence number.
  rpc ListThreadMessages(ListThreadMessagesRequest) returns (ListThreadMessagesResponse) {
    option (google.api.http) = {get: "/v1/platform/ai/threads/{thread_id}/messages"};
    option (google.api.method_signature) = "thread_id";
  }

  // Cancels an active streaming turn on a private chat thread.
  rpc CancelThreadTurn(CancelThreadTurnRequest) returns (Thread) {
    option (google.api.http) = {
      post: "/v1/platform/ai/threads/{id}:cancel"
      body: "*"
    };
    option (google.api.method_signature) = "id";
  }

  // Streams a new conversational turn on a private thread over gRPC server streaming.
  rpc StreamThreadTurn(StreamThreadTurnRequest) returns (stream ThreadStreamEvent);

  // Resolves pending write-tool approval requests and resumes streaming the thread turn.
  rpc StreamResolveToolApprovals(StreamResolveToolApprovalsRequest) returns (stream ThreadStreamEvent);

  // Executes a single-turn headless generation with optional attachments and output schema.
  rpc Generate(GenerateRequest) returns (Run) {
    option (google.api.http) = {
      post: "/v1/platform/ai:generate"
      body: "*"
    };
    option (google.api.method_signature) = "prompt";
  }

  // Lists AI execution runs across chat, workflow, API, and MCP sources.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option (google.api.http) = {get: "/v1/platform/ai/runs"};
  }

  // Retrieves a single AI execution run hydrated with its ordered LLM/tool steps.
  rpc GetRun(GetRunRequest) returns (Run) {
    option (google.api.http) = {get: "/v1/platform/ai/runs/{id}"};
    option (google.api.method_signature) = "id";
  }
}

// ThinkingConfig configures extended reasoning behavior on supported models.
message ThinkingConfig {
  // Optional. Whether extended thinking is enabled.
  bool enabled = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Reasoning effort level ('low', 'medium', 'high').
  optional string effort = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Explicit reasoning token budget.
  optional int32 budget_tokens = 3 [(google.api.field_behavior) = OPTIONAL];
}

// GenerationConfig configures LLM sampling and reasoning parameters.
message GenerationConfig {
  // Optional. Sampling temperature parameter.
  optional double temperature = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Maximum output tokens to generate.
  optional int32 max_tokens = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Nucleus sampling top-p parameter.
  optional double top_p = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Extended thinking/reasoning configuration.
  optional ThinkingConfig thinking = 4 [(google.api.field_behavior) = OPTIONAL];
}

// ErrorDetail captures a structured machine code and message for AI failures.
message ErrorDetail {
  // Optional. Machine-readable error code.
  optional string code = 1 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Human-readable error message.
  string message = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// TokenUsage breaks down LLM token accounting across a step, message, or run.
message TokenUsage {
  // Output only. Prompt/input tokens consumed.
  int32 input = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Completion/output tokens generated.
  int32 output = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Reasoning/thinking tokens generated.
  int32 reasoning = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Prompt-cached input tokens served.
  int32 cached = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Total tokens consumed.
  int32 total = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ModelRoleSettings maps workspace semantic roles to registered model IDs.
message ModelRoleSettings {
  // Optional. Default workspace model ID (`mdl_...`).
  optional string default_model_id = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Fast/low-latency workspace model ID (`mdl_...`).
  optional string fast_model_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Reasoning-optimized workspace model ID (`mdl_...`).
  optional string reasoning_model_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// GovernanceConfig configures workspace AI budget caps and run retention policies.
message GovernanceConfig {
  // Optional. Monthly workspace AI spend cap in USD (0 or unset disables cap).
  optional double monthly_budget_usd = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Number of days to retain AI run logs (default 90; 0 disables pruning).
  int32 run_retention_days = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Settings holds workspace-level AI model defaults, governance, and spend telemetry.
message Settings {
  // Optional. Workspace model role defaults.
  ModelRoleSettings models = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Workspace AI governance policies.
  GovernanceConfig governance = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Estimated AI spend accumulated in the current calendar month (USD).
  double current_month_spend_usd = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ProviderDescriptor describes a supported LLM provider driver blueprint.
message ProviderDescriptor {
  // Output only. Driver key ('gemini', 'openai', 'anthropic', 'openrouter', 'ollama', 'openai_compatible').
  string driver = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Human-readable display name.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Summary of the provider driver and capabilities.
  string description = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Default base API URL for this driver.
  string default_base_url = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether an API key is required for this driver.
  bool api_key_required = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether live upstream model discovery is supported.
  bool supports_discovery = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Icon identifier for UI display.
  string logo_icon = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ProviderConfig stores non-secret connection configuration for an LLM provider.
message ProviderConfig {
  // Optional. Custom or override base URL for the provider API.
  optional string base_url = 1 [(google.api.field_behavior) = OPTIONAL];
}

// ProviderSecretInput carries write-only credentials when creating or updating a provider.
message ProviderSecretInput {
  // Optional. Provider API key.
  optional string api_key = 1 [(google.api.field_behavior) = INPUT_ONLY];

  // Optional. Custom HTTP headers sent with provider requests.
  map<string, string> headers = 2 [(google.api.field_behavior) = INPUT_ONLY];
}

// ProviderStatus reflects the latest verification health of an LLM provider.
message ProviderStatus {
  // Output only. Verification state ('unverified', 'healthy', 'unhealthy').
  string state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp of the last verification attempt.
  optional google.protobuf.Timestamp last_verified_at = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Structured error from the last failed verification, if any.
  optional ErrorDetail error = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Provider represents a configured LLM provider connection in a workspace.
message Provider {
  // Output only. Unique identifier with prefix `prv_`.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Owning workspace identifier (`spc_...`).
  string space_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Human-readable display name.
  string name = 3 [(google.api.field_behavior) = REQUIRED];

  // Required. Provider driver ('gemini', 'openai', 'anthropic', 'openrouter', 'ollama', 'openai_compatible').
  string driver = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. Non-secret provider connection configuration.
  optional ProviderConfig config = 5 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Whether encrypted credentials are stored for this provider.
  bool has_secret = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Latest provider verification status.
  optional ProviderStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Whether this provider is enabled for use.
  bool is_enabled = 8 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Number of registered models linked to this provider.
  int32 model_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Creation timestamp.
  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Last update timestamp.
  google.protobuf.Timestamp update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Input only. Write-only provider credentials encrypted at rest and never returned on reads.
  optional ProviderSecretInput secret = 12 [(google.api.field_behavior) = INPUT_ONLY];
}

// ModelCapabilities describes supported modalities and features of a model.
message ModelCapabilities {
  // Optional. Supports function/tool calling.
  bool tool_calling = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Supports image/vision inputs.
  bool vision = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Supports native document/PDF inputs.
  bool document = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Supports audio inputs.
  bool audio = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Supports extended thinking/reasoning.
  bool reasoning = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Supports structured JSON schema output.
  bool structured_output = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Supports token streaming.
  bool streaming = 7 [(google.api.field_behavior) = OPTIONAL];
}

// ModelLimits captures token context and output limits for a model.
message ModelLimits {
  // Optional. Maximum input context window in tokens.
  int32 context_window = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Maximum output generation tokens.
  int32 max_output_tokens = 2 [(google.api.field_behavior) = OPTIONAL];
}

// ModelPricing captures per-million-token cost rates in USD.
message ModelPricing {
  // Optional. Input token price per 1M tokens in USD.
  double input_per_million_usd = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Output token price per 1M tokens in USD.
  double output_per_million_usd = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Cached input token price per 1M tokens in USD.
  double cached_input_per_million_usd = 3 [(google.api.field_behavior) = OPTIONAL];
}

// ModelProfile groups capability flags, token limits, and pricing metadata.
message ModelProfile {
  // Optional. Supported capabilities of the model.
  optional ModelCapabilities capabilities = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Context and output token limits.
  optional ModelLimits limits = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Per-million-token pricing rates.
  optional ModelPricing pricing = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Model represents a registered AI model available in the workspace.
message Model {
  // Output only. Unique identifier with prefix `mdl_`.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Owning workspace identifier (`spc_...`).
  string space_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Parent LLM provider identifier (`prv_...`).
  string provider_id = 3 [(google.api.field_behavior) = REQUIRED];

  // Output only. Hydrated parent provider display name.
  string provider_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Hydrated parent provider driver.
  string provider_driver = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Upstream model identifier (e.g. 'gemini-2.5-flash', 'gpt-4.1').
  string model_id = 6 [(google.api.field_behavior) = REQUIRED];

  // Required. Human-readable display name.
  string display_name = 7 [(google.api.field_behavior) = REQUIRED];

  // Output only. Registration origin ('catalog', 'discovered', 'custom').
  string source = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Model capability, limit, and pricing profile.
  optional ModelProfile profile = 9 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Default generation parameter overrides for this model.
  optional GenerationConfig config = 10 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether this model is enabled for selection and execution.
  bool is_enabled = 11 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Creation timestamp.
  google.protobuf.Timestamp create_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Last update timestamp.
  google.protobuf.Timestamp update_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// DiscoveredModel describes an upstream model discovered from a provider.
message DiscoveredModel {
  // Output only. Upstream model identifier.
  string model_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Human-readable display name.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Inferred or cataloged model profile.
  optional ModelProfile profile = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether this model is already registered under the provider.
  bool already_registered = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// MCPServerConfig configures connection and tool trust behavior for an MCP server.
message MCPServerConfig {
  // Required. Endpoint URL ('in-memory://saturn' for system server, HTTP(S) URL for external servers).
  string url = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Authentication mode ('none', 'bearer', 'custom_headers').
  string auth_type = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. Whether read-only MCP tool hints skip write-approval prompts.
  bool trust_read_hints = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Request timeout in seconds.
  int32 timeout_seconds = 4 [(google.api.field_behavior) = OPTIONAL];
}

// MCPAuthSecretInput carries write-only auth credentials for an external HTTP MCP server.
message MCPAuthSecretInput {
  // Optional. Bearer token for 'bearer' auth_type.
  optional string bearer_token = 1 [(google.api.field_behavior) = INPUT_ONLY];

  // Optional. Custom HTTP headers for 'custom_headers' auth_type.
  map<string, string> headers = 2 [(google.api.field_behavior) = INPUT_ONLY];
}

// MCPServerInfo captures server metadata returned by the MCP initialize handshake.
message MCPServerInfo {
  // Output only. Reported server name.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Reported server version.
  string version = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// MCPToolSummary summarizes a discovered MCP tool and its JSON input schema.
message MCPToolSummary {
  // Output only. Tool name.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Optional human-readable title.
  optional string title = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Description of what the tool does.
  string description = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. JSON Schema describing tool arguments.
  optional google.protobuf.Struct input_schema = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. MCP ReadOnlyHint annotation.
  bool read_only_hint = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. MCP DestructiveHint annotation.
  bool destructive_hint = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
