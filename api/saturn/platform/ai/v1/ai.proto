  // Output only. Pending tool calls requiring approval on 'tool.approval.required'.
  repeated PendingToolApproval approvals = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Completed persisted message on 'message.completed'.
  optional ThreadMessage message = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Updated thread snapshot on 'thread.updated'.
  optional Thread thread = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Completed run snapshot on 'run.completed'.
  optional Run run = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Structured error detail on 'run.error'.
  optional ErrorDetail error = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
}

