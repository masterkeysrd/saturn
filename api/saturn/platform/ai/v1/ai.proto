  // Output only. Structured error from the last failed test or sync, if any.
  optional ErrorDetail error = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// MCPServer represents a built-in or external HTTP MCP tool server.
message MCPServer {
