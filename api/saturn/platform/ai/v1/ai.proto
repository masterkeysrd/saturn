  // Required. User message text for this turn.
  string content = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. Optional inline file attachments (max 5 files, <= 10 MB each).
  repeated TurnAttachment attachments = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Per-turn agent override (`agt_...`).
  optional string agent_id = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Per-turn model override (`mdl_...`).
  optional string model_id = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Active UI route or contextual hint passed by the caller (e.g. Global Cmd+J Drawer).
  optional string context_hint = 6 [(google.api.field_behavior) = OPTIONAL];
