  // Output only. Ordered LLM and tool execution steps hydrated on GetRun.
  repeated RunStep steps = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when execution started.
  google.protobuf.Timestamp start_time = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when execution ended.
  optional google.protobuf.Timestamp end_time = 18 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Creation timestamp.
  google.protobuf.Timestamp create_time = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
}

