# Platform Agent service API configuration.
#
# All platform agent endpoints require JWT Bearer authentication.
# Space-scoped endpoints require the Space-Id header.

name: saturn.platform.agent.v1
title: "Saturn Platform Agent API"
apis:
  - saturn.platform.agent.v1.AgentService

documentation:
  summary: "Provides platform agents configuration and execution pipeline. Space-scoped endpoints require the 'space-id' header containing the workspace ID."

authentication:
  rules:
    # All agent endpoints require authentication
    - selector: "saturn.platform.agent.v1.AgentService.*"
      auth_required: true
    - selector: "saturn.platform.agent.v1.AgentService.GetProvider"
      auth_required: true
      api_key_scopes:
        - agents:read
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.ListProviders"
      auth_required: true
      api_key_scopes:
        - agents:read
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.GetAgent"
      auth_required: true
      api_key_scopes:
        - agents:read
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.ListAgents"
      auth_required: true
      api_key_scopes:
        - agents:read
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.ListAgentRuns"
      auth_required: true
      api_key_scopes:
        - agents:read
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.GetAgentCatalog"
      auth_required: true
      api_key_scopes:
        - agents:read
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.GetProviderCatalog"
      auth_required: true
      api_key_scopes:
        - agents:read
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.CreateProvider"
      auth_required: true
      api_key_scopes:
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.UpdateProvider"
      auth_required: true
      api_key_scopes:
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.DeleteProvider"
      auth_required: true
      api_key_scopes:
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.CreateAgent"
      auth_required: true
      api_key_scopes:
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.UpdateAgent"
      auth_required: true
      api_key_scopes:
        - agents:write
    - selector: "saturn.platform.agent.v1.AgentService.DeleteAgent"
      auth_required: true
      api_key_scopes:
        - agents:write

space:
  rules:
    # Agent endpoints require workspace scope validation from metadata space-id header
    - selector: "saturn.platform.agent.v1.AgentService.*"
      scoped: true
