syntax = "proto3";

package saturn.platform.agent.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/masterkeysrd/saturn/apis/saturn/platform/agent/v1;agentv1";

// AgentService manages LLM connection providers, AI agent instances, and logs.
service AgentService {
  // CreateProvider registers a new LLM provider connection in the workspace.
  rpc CreateProvider(CreateProviderRequest) returns (LLMProvider) {
    option (google.api.http) = {
      post: "/v1/platform/agent/providers"
      body: "*"
    };
  }

  // GetProvider retrieves a single LLM provider configuration.
  rpc GetProvider(GetProviderRequest) returns (LLMProvider) {
    option (google.api.http) = {get: "/v1/platform/agent/providers/{id}"};
  }

  // ListProviders lists all configured LLM providers in the workspace.
  rpc ListProviders(google.protobuf.Empty) returns (ListProvidersResponse) {
    option (google.api.http) = {get: "/v1/platform/agent/providers"};
  }

  // UpdateProvider modifies LLM provider details (rotates API keys, etc.).
  rpc UpdateProvider(UpdateProviderRequest) returns (LLMProvider) {
    option (google.api.http) = {
      put: "/v1/platform/agent/providers/{id}"
      body: "*"
    };
  }

  // DeleteProvider deletes an LLM provider connection.
  rpc DeleteProvider(DeleteProviderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/platform/agent/providers/{id}"};
  }

  // CreateAgent creates a new AI Agent configured with prompt instructions.
  rpc CreateAgent(CreateAgentRequest) returns (Agent) {
    option (google.api.http) = {
      post: "/v1/platform/agent/agents"
      body: "*"
    };
  }

  // GetAgent retrieves a configured Agent's parameters.
  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.http) = {get: "/v1/platform/agent/agents/{id}"};
  }

  // ListAgents lists all active AI Agent instances in the workspace.
  rpc ListAgents(google.protobuf.Empty) returns (ListAgentsResponse) {
    option (google.api.http) = {get: "/v1/platform/agent/agents"};
  }

  // UpdateAgent modifies agent prompt directives or model settings.
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent) {
    option (google.api.http) = {
      put: "/v1/platform/agent/agents/{id}"
      body: "*"
    };
  }

  // DeleteAgent deletes an AI Agent configuration.
  rpc DeleteAgent(DeleteAgentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/platform/agent/agents/{id}"};
  }

  // ListAgentRuns retrieves execution history logs for a specific agent.
  rpc ListAgentRuns(ListAgentRunsRequest) returns (ListAgentRunsResponse) {
    option (google.api.http) = {get: "/v1/platform/agent/agents/{agent_id}/runs"};
  }

  // GetAgentCatalog retrieves standard agent purpose blueprints (descriptors).
  rpc GetAgentCatalog(google.protobuf.Empty) returns (GetAgentCatalogResponse) {
    option (google.api.http) = {get: "/v1/platform/agent/agents-catalog"};
  }

  // GetProviderCatalog retrieves standard connection type templates.
  rpc GetProviderCatalog(google.protobuf.Empty) returns (GetProviderCatalogResponse) {
    option (google.api.http) = {get: "/v1/platform/agent/providers-catalog"};
  }
}

message LLMProvider {
  string id = 1;
  string space_id = 2;
  string name = 3;
  string compatibility_mode = 4;
  string api_url = 5;
  string api_key = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
}

message Agent {
  string id = 1;
  string space_id = 2;
  string llm_provider_id = 3;
  string name = 4;
  string description = 5;
  string purpose = 6;
  repeated string tags = 7;
  string model_name = 8;
  string system_instruction = 9;
  double temperature = 10;
  bool is_enabled = 11;
  google.protobuf.Timestamp create_time = 12;
  google.protobuf.Timestamp update_time = 13;
}

message AgentRun {
  string id = 1;
  string agent_id = 2;
  string space_id = 3;
  string status = 4;
  string input_raw = 5;
  string output_raw = 6;
  string error_message = 7;
  int32 tokens_used = 8;
  google.protobuf.Timestamp create_time = 9;
}

message CreateProviderRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string compatibility_mode = 2 [(google.api.field_behavior) = REQUIRED];
  string api_url = 3;
  string api_key = 4;
}

message GetProviderRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListProvidersResponse {
  repeated LLMProvider providers = 1;
}

message UpdateProviderRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string api_url = 3;
  string api_key = 4;
}

message DeleteProviderRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateAgentRequest {
  string llm_provider_id = 1;
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
  string purpose = 4 [(google.api.field_behavior) = REQUIRED];
  repeated string tags = 5;
  string model_name = 6 [(google.api.field_behavior) = REQUIRED];
  string system_instruction = 7;
  double temperature = 8;
}

message GetAgentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message UpdateAgentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string llm_provider_id = 2;
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  string description = 4;
  repeated string tags = 5;
  string model_name = 6 [(google.api.field_behavior) = REQUIRED];
  string system_instruction = 7;
  double temperature = 8;
  bool is_enabled = 9;
}

message DeleteAgentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListAgentRunsRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 2;
  string page_token = 3;
}

message ListAgentRunsResponse {
  repeated AgentRun runs = 1;
  string next_page_token = 2;
}

message AgentBlueprintDescriptor {
  string purpose = 1;
  string display_name = 2;
  string description = 3;
  repeated string default_tags = 4;
  string default_system_instruction = 5;
  string required_response_schema = 6;
}

message GetAgentCatalogResponse {
  repeated AgentBlueprintDescriptor blueprints = 1;
}

message ProviderBlueprintDescriptor {
  string id = 1;
  string display_name = 2;
  string description = 3;
  string compatibility_mode = 4;
  string default_api_url = 5;
  bool is_api_key_required = 6;
  string logo_icon = 7;
}

message GetProviderCatalogResponse {
  repeated ProviderBlueprintDescriptor blueprints = 1;
}
