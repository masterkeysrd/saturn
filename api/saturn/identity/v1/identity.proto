syntax = "proto3";

package saturn.identity.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/masterkeysrd/saturn/apis/saturn/identity/v1;identityv1";

// Identity provides user authentication and session management.
service Identity {
  // Authenticates a user and returns access and refresh tokens.
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse) {
    option (google.api.http) = {
      post: "/v1/identity/users:login"
      body: "*"
    };
  }

  // Registers a new user account.
  rpc RegisterUser(RegisterUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/identity/users:register"
      body: "*"
    };
    option (google.api.method_signature) = "email,username,name,password";
  }

  // Refreshes an authenticated session and issues a new token pair.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse) {
    option (google.api.http) = {
      post: "/v1/identity/sessions:refresh"
      body: "*"
    };
    option (google.api.method_signature) = "refresh_token";
  }

  // Terminates the current session by revoking the refresh token.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/identity/sessions:logout"
      body: "*"
    };
    option (google.api.method_signature) = "refresh_token";
  }

  // Retrieves the profile of the currently authenticated user.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1/identity/users/me"};
  }

  // Lists all active, non-expired sessions for the authenticated user.
  rpc ListActiveSessions(ListActiveSessionsRequest) returns (ListActiveSessionsResponse) {
    option (google.api.http) = {get: "/v1/identity/sessions"};
  }

  // Revokes a specific active user session by ID.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {
    option (google.api.http) = {
      post: "/v1/identity/sessions/{session_id}:revoke"
      body: "*"
    };
    option (google.api.method_signature) = "session_id";
  }

  // Revokes all active sessions for the authenticated user globally.
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse) {
    option (google.api.http) = {
      post: "/v1/identity/sessions:revoke-all"
      body: "*"
    };
  }

  // Lists security audit log events for the authenticated user.
  rpc ListMySecurityEvents(ListMySecurityEventsRequest) returns (ListMySecurityEventsResponse) {
    option (google.api.http) = {get: "/v1/identity/users/me/security-events"};
  }

  // Authenticated RPC: Lists all registered MFA factors for the caller.
  rpc ListMFAFactors(ListMFAFactorsRequest) returns (ListMFAFactorsResponse) {
    option (google.api.http) = {get: "/v1/identity/mfa/factors"};
  }

  // Authenticated RPC: Revokes a registered MFA factor.
  rpc DeleteMFAFactor(DeleteMFAFactorRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/identity/mfa/factors/{factor_id}"};
    option (google.api.method_signature) = "factor_id";
  }

  // Authenticated RPC: Sets a factor as the default/primary option.
  rpc SetPrimaryMFAFactor(SetPrimaryMFAFactorRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/identity/mfa/factors/{factor_id}:set-primary"
      body: "*"
    };
    option (google.api.method_signature) = "factor_id";
  }

  // Authenticated RPC: Generates a new pending TOTP secret and QR code URI.
  rpc SetupTOTP(SetupTOTPRequest) returns (SetupTOTPResponse) {
    option (google.api.http) = {
      post: "/v1/identity/mfa/totp:setup"
      body: "*"
    };
  }

  // Authenticated RPC: Confirms setup of the TOTP factor with a verification code.
  rpc ConfirmTOTP(ConfirmTOTPRequest) returns (ConfirmTOTPResponse) {
    option (google.api.http) = {
      post: "/v1/identity/mfa/totp:confirm"
      body: "*"
    };
  }

  // Authenticated RPC: Regenerates a fresh set of 8 single-use recovery codes.
  rpc RegenerateBackupCodes(RegenerateBackupCodesRequest) returns (RegenerateBackupCodesResponse) {
    option (google.api.http) = {
      post: "/v1/identity/mfa/backup-codes:regenerate"
      body: "*"
    };
  }

  // Obtains a short-lived random nonce challenge for device registration or biometric login.
  rpc CreateAuthChallenge(CreateAuthChallengeRequest) returns (CreateAuthChallengeResponse) {
    option (google.api.http) = {
      post: "/v1/identity/devices/challenges"
      body: "*"
    };
  }

  // Authenticated RPC: Creates a new trusted hardware device for the caller.
  // Requires TOTP code verification if the user has MFA enabled.
  rpc CreateDevice(CreateDeviceRequest) returns (Device) {
    option (google.api.http) = {
      post: "/v1/identity/devices"
      body: "device"
    };
  }

  // Authenticated RPC: Lists all registered devices for the caller.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option (google.api.http) = {get: "/v1/identity/devices"};
  }

  // Authenticated RPC: Revokes a registered trusted device and terminates its sessions.
  rpc RevokeDevice(RevokeDeviceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/identity/devices/{device_id}:revoke"
      body: "*"
    };
    option (google.api.method_signature) = "device_id";
  }
}

// Request message for Identity.LoginUser.
message LoginUserRequest {
  // UserPassword contains credentials for password authentication.
  message UserPassword {
    // Required. The username or email of the user.
    string identifier = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The password of the user.
    string password = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // MfaAssertion contains Step 2 second-factor verification credentials.
  message MfaAssertion {
    // Required. Ephemeral, single-use ticket received from Step 1.
    string mfa_ticket = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The specific factor being satisfied (or "recovery" for backup codes).
    string factor_id = 2 [(google.api.field_behavior) = REQUIRED];

    // Polymorphic assertion payload depending on the factor chosen.
    oneof factor_payload {
      // 6-digit TOTP code.
      string totp_code = 3;

      // 8-character single-use recovery code.
      string backup_code = 4;
    }
  }

  // DeviceAssertion contains hardware biometric assertion credentials.
  message DeviceAssertion {
    // Required. Unique identifier of the enrolled device.
    string device_id = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. Server-generated challenge nonce signed by the device.
    string challenge = 2 [(google.api.field_behavior) = REQUIRED];

    // Required. Cryptographic signature generated by the Secure Enclave / KeyStore.
    bytes signature = 3 [(google.api.field_behavior) = REQUIRED];
  }

  // Required. The authentication method to use for signing in.
  oneof method {
    // Password-based authentication credentials.
    UserPassword user_password = 1;

    // Second-factor authentication assertion.
    MfaAssertion mfa_assertion = 2;

    // Hardware biometric device assertion.
    DeviceAssertion device_assertion = 3;
  }
}

// Response message for Identity.LoginUser.
message LoginUserResponse {
  // MfaChallenge contains challenge details when Step 2 verification is required.
  message MfaChallenge {
    // Output only. Ephemeral, single-use ticket to pass into Step 2 verification.
    string ticket = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. List of registered factors the user can select from.
    repeated MfaFactorDescriptor available_factors = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Output only. Present when password authentication succeeded but Step 2 MFA verification is required.
  // When this field is populated, access_token and refresh_token will be omitted.
  MfaChallenge mfa = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The user's unique identifier.
  // Formatted as `usr_<ksuid>` (e.g., `usr_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string user_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The access token for authenticated requests.
  string access_token = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The expiration time of the access token in Unix seconds.
  int64 access_token_expires_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The opaque refresh token.
  string refresh_token = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The expiration time of the refresh token in Unix seconds.
  int64 refresh_token_expires_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// MfaFactorDescriptor describes an enrolled multi-factor authentication (MFA) factor.
message MfaFactorDescriptor {
  // Output only. The unique identifier of the registered MFA factor.
  // Formatted as `mfa_<ksuid>` (e.g., `mfa_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string factor_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The category or protocol of the factor (e.g., `totp`, `webauthn`, `mobile_push`).
  string type = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. User-assigned label or device name (e.g., "Personal iPhone", "Hardware YubiKey").
  string name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Indicates whether this factor is the default/primary choice presented on login.
  bool is_primary = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Factor-specific challenge parameters or prompt description.
  string challenge = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.RegisterUser.
message RegisterUserRequest {
  // Required. The user's primary email address.
  string email = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The user's chosen unique username.
  string username = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The user's full or display name.
  string name = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. The URL pointing to the user's avatar image.
  string avatar_url = 4 [(google.api.field_behavior) = OPTIONAL];

  // Required. The user's password for authentication.
  string password = 5 [(google.api.field_behavior) = REQUIRED];
}

// User represents a registered user account resource.
message User {
  // Output only. The user's unique identifier.
  // Formatted as `usr_<ksuid>` (e.g., `usr_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The user's primary email address.
  string email = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The user's unique username.
  string username = 3 [(google.api.field_behavior) = REQUIRED];

  // Required. The user's full or display name.
  string name = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. The URL pointing to the user's avatar image.
  string avatar_url = 5 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The current account lifecycle status (e.g., active, pending_approval, suspended).
  string status = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the user account was created.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the user account was last updated.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The optimistic concurrency control version number.
  int64 version = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.RefreshSession.
message RefreshSessionRequest {
  // Required. The refresh token to exchange for new tokens.
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for Identity.RefreshSession.
message RefreshSessionResponse {
  // Output only. The new access token for authenticated requests.
  string access_token = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The expiration time of the new access token in Unix seconds.
  int64 access_token_expires_at = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The new opaque refresh token.
  string refresh_token = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The expiration time of the new refresh token in Unix seconds.
  int64 refresh_token_expires_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.Logout.
message LogoutRequest {
  // Required. The refresh token to be revoked.
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for Identity.Logout.
message LogoutResponse {}

// Request message for Identity.GetCurrentUser.
message GetCurrentUserRequest {}

// UserSession represents an active user session resource.
message UserSession {
  // Output only. The unique identifier of the session.
  string session_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The User-Agent string associated with the session.
  string user_agent = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The IP address of the client that created the session.
  string ip_address = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the session was initialized.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the session was last utilized.
  google.protobuf.Timestamp last_used_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.ListActiveSessions.
message ListActiveSessionsRequest {}

// Response message for Identity.ListActiveSessions.
message ListActiveSessionsResponse {
  // Output only. The list of active sessions for the authenticated user.
  repeated UserSession sessions = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.RevokeSession.
message RevokeSessionRequest {
  // Required. The unique identifier of the session to revoke.
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for Identity.RevokeSession.
message RevokeSessionResponse {}

// Request message for Identity.RevokeAllSessions.
message RevokeAllSessionsRequest {}

// Response message for Identity.RevokeAllSessions.
message RevokeAllSessionsResponse {}

// SecurityEvent represents a security audit log entry for the user account.
message SecurityEvent {
  // Output only. The unique identifier of the security event.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The email address of the user associated with the event.
  string email = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The type of security event that occurred (e.g., login, password change).
  string event_type = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The IP address from which the event originated.
  string ip_address = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The User-Agent string of the client that triggered the event.
  string user_agent = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the event was created.
  google.protobuf.Timestamp created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.ListMySecurityEvents.
message ListMySecurityEventsRequest {
  // Optional. The maximum number of security events to return.
  int32 limit = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListMySecurityEvents` call.
  // Provide this to retrieve the subsequent page.
  string next_page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Identity.ListMySecurityEvents.
message ListMySecurityEventsResponse {
  // Output only. The list of security events for the authenticated user.
  repeated SecurityEvent events = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A token, which can be sent as `next_page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.ListMFAFactors.
// Lists all enrolled, active multi-factor authentication methods for the authenticated caller.
message ListMFAFactorsRequest {}

// Response message for Identity.ListMFAFactors.
message ListMFAFactorsResponse {
  // Output only. The list of active registered MFA factors for the authenticated user.
  repeated MfaFactorDescriptor factors = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Indicates whether emergency recovery backup codes have been generated for the account.
  bool has_backup_codes = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The count of unconsumed, single-use recovery backup codes available.
  int32 remaining_backup_codes = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.DeleteMFAFactor.
message DeleteMFAFactorRequest {
  // Required. The unique identifier of the MFA factor to revoke (e.g., `mfa_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string factor_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for Identity.SetPrimaryMFAFactor.
message SetPrimaryMFAFactorRequest {
  // Required. The unique identifier of the MFA factor to promote as the primary/default method.
  string factor_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for Identity.SetupTOTP.
// Initiates enrollment of an RFC 6238 Time-based One-Time Password (TOTP) authenticator application.
message SetupTOTPRequest {
  // Required. User-facing label or device name for the authenticator app (e.g. "Personal iPhone", "Google Authenticator").
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for Identity.SetupTOTP.
// Returns the provisional credentials required to configure an authenticator app.
message SetupTOTPResponse {
  // Output only. The provisional factor ID staged for confirmation (e.g., `mfa_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string factor_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Cryptographically random 160-bit Base32-encoded TOTP secret key for manual configuration.
  string secret = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Fully qualified `otpauth://totp/...` URI suitable for generating QR codes.
  string otpauth_uri = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Inline SVG markup encoding the `otpauth://` URI for client-side rendering without external dependencies.
  string qr_code_svg = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.ConfirmTOTP.
// Verifies the initial 6-digit TOTP code generated by the authenticator app to activate the factor.
message ConfirmTOTPRequest {
  // Required. The provisional factor ID returned from SetupTOTP.
  string factor_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The current 6-digit verification code from the authenticator app matching RFC 6238.
  string code = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response message for Identity.ConfirmTOTP.
message ConfirmTOTPResponse {
  // Output only. Set of 8 single-use recovery backup codes (`XXXX-XXXX`) generated upon first factor enrollment.
  // Must be stored securely by the user; codes are hashed with SHA-256 at rest and cannot be retrieved again.
  repeated string backup_codes = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.RegenerateBackupCodes.
// Requests a fresh batch of emergency single-use recovery codes, invalidating all existing unused codes.
message RegenerateBackupCodesRequest {
  // Required. Step-up 6-digit TOTP verification code from an active authenticator factor to authorize regeneration.
  string verification_code = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for Identity.RegenerateBackupCodes.
message RegenerateBackupCodesResponse {
  // Output only. Newly generated set of 8 single-use recovery backup codes (`XXXX-XXXX`).
  repeated string backup_codes = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.CreateAuthChallenge.
message CreateAuthChallengeRequest {}

// Response message for Identity.CreateAuthChallenge.
message CreateAuthChallengeResponse {
  // Output only. Cryptographically secure random challenge nonce.
  string challenge = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Expiration timestamp in seconds since Unix epoch (valid for 5 minutes).
  int64 expires_at = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.CreateDevice.
// Enrolls an asymmetric public key (ECDSA P-256) backed by hardware (Secure Enclave / KeyStore).
message CreateDeviceRequest {
  // Required. The device to create.
  Device device = 1 [(google.api.field_behavior) = REQUIRED];
}

// Device represents a registered trusted hardware device (e.g. phone with Secure Enclave / KeyStore).
message Device {
  // Output only. The assigned device identifier formatted as `dev_<ksuid>`.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. User-friendly name of the device (e.g. "iPhone 16 Pro", "Pixel 9").
  string device_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. Cryptographic algorithm (e.g., "ES256").
  string algorithm = 3 [(google.api.field_behavior) = REQUIRED];

  // Required. Input only. Raw bytes or DER-encoded public key from the device hardware.
  bytes public_key = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // Required. Input only. The challenge nonce returned from CreateAuthChallenge.
  string challenge = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // Required. Input only. Cryptographic signature over the challenge generated by the hardware private key.
  bytes signature = 6 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // Optional/Conditional. Input only. Current 6-digit TOTP code (required if MFA is enabled on user account).
  string totp_code = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // Output only. When the device was enrolled.
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the device was last used for authentication.
  google.protobuf.Timestamp last_used_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Absolute expiration timestamp (60 days from enrollment or re-authentication).
  google.protobuf.Timestamp expire_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.ListDevices.
message ListDevicesRequest {}

// Response message for Identity.ListDevices.
message ListDevicesResponse {
  // Output only. List of trusted devices registered to the caller's account.
  repeated Device devices = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Identity.RevokeDevice.
message RevokeDeviceRequest {
  // Required. The unique identifier of the trusted device to revoke (e.g. `dev_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string device_id = 1 [(google.api.field_behavior) = REQUIRED];
}
