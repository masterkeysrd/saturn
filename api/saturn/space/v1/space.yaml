# Space service API configuration.
#
# All space endpoints require JWT Bearer authentication.
# Space-scoping via 'space-id' header is disabled because authorization
# is handled explicitly using the workspace ID from request path and payload.

name: saturn.space.v1
title: "Saturn Space API"
apis:
  - saturn.space.v1.Spaces

documentation:
  summary: "Provides workspace (space) management including CRUD operations and member management. Workspace authorization is handled explicitly using the workspace ID in the request path and payload."

authentication:
  rules:
    # All space endpoints require authentication
    - selector: "saturn.space.v1.Spaces.*"
      auth_required: true

space:
  rules:
    # Disable metadata header space-scoping for all Spaces service endpoints.
    # Authorization is handled explicitly inside the domain service using request payloads.
    - selector: "saturn.space.v1.Spaces.*"
      scoped: false
