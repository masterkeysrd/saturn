syntax = "proto3";

package saturn.space.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/masterkeysrd/saturn/apis/saturn/space/v1;spacev1";

// Spaces provides workspace management including CRUD operations and member administration.
service Spaces {
  // Creates a new workspace.
  rpc CreateSpace(CreateSpaceRequest) returns (Space) {
    option (google.api.http) = {
      post: "/v1/spaces"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Retrieves a workspace by ID.
  rpc GetSpace(GetSpaceRequest) returns (Space) {
    option (google.api.http) = {get: "/v1/spaces/{space_id}"};
    option (google.api.method_signature) = "space_id";
  }

  // Updates an existing workspace.
  rpc UpdateSpace(UpdateSpaceRequest) returns (Space) {
    option (google.api.http) = {
      patch: "/v1/spaces/{space_id}"
      body: "space"
    };
    option (google.api.method_signature) = "space,update_mask";
  }

  // Deletes a workspace by ID.
  rpc DeleteSpace(DeleteSpaceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/spaces/{space_id}"};
    option (google.api.method_signature) = "space_id";
  }

  // Lists all workspaces the authenticated user has access to.
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse) {
    option (google.api.http) = {get: "/v1/spaces"};
  }

  // Creates a member in a workspace.
  rpc CreateSpaceMember(CreateSpaceMemberRequest) returns (SpaceMember) {
    option (google.api.http) = {
      post: "/v1/spaces/{space_id}/members"
      body: "member"
    };
    option (google.api.method_signature) = "space_id,member";
  }

  // Deletes a member from a workspace.
  rpc DeleteSpaceMember(DeleteSpaceMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/spaces/{space_id}/members/{user_id}"};
    option (google.api.method_signature) = "space_id,user_id";
  }

  // Updates an existing member within a workspace.
  rpc UpdateSpaceMember(UpdateSpaceMemberRequest) returns (SpaceMember) {
    option (google.api.http) = {
      patch: "/v1/spaces/{space_id}/members/{member.user_id}"
      body: "member"
    };
    option (google.api.method_signature) = "space_id,member,update_mask";
  }

  // Lists all members belonging to a workspace.
  rpc ListSpaceMembers(ListSpaceMembersRequest) returns (ListSpaceMembersResponse) {
    option (google.api.http) = {get: "/v1/spaces/{space_id}/members"};
    option (google.api.method_signature) = "space_id";
  }

  // Retrieves the configuration settings for a workspace.
  rpc GetSettings(GetSettingsRequest) returns (Settings) {
    option (google.api.http) = {get: "/v1/spaces/{space_id}/settings"};
    option (google.api.method_signature) = "space_id";
  }

  // Updates the configuration settings for a workspace.
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings) {
    option (google.api.http) = {
      patch: "/v1/spaces/{space_id}/settings"
      body: "settings"
    };
    option (google.api.method_signature) = "space_id,settings,update_mask";
  }

  // Retrieves the current user's dashboard preferences for a workspace.
  rpc GetDashboardPreferences(GetDashboardPreferencesRequest) returns (DashboardPreferences) {
    option (google.api.http) = {get: "/v1/spaces/{space_id}/dashboard-preferences"};
    option (google.api.method_signature) = "space_id";
  }

  // Updates the current user's dashboard preferences for a workspace.
  rpc UpdateDashboardPreferences(UpdateDashboardPreferencesRequest) returns (DashboardPreferences) {
    option (google.api.http) = {
      patch: "/v1/spaces/{space_id}/dashboard-preferences"
      body: "dashboard_preferences"
    };
    option (google.api.method_signature) = "space_id,dashboard_preferences,update_mask";
  }

  // Lists all active API key grants targeting a workspace (admin/owner only).
  rpc ListSpaceAPIKeyGrants(ListSpaceAPIKeyGrantsRequest) returns (ListSpaceAPIKeyGrantsResponse) {
    option (google.api.http) = {get: "/v1/spaces/{space_id}/api-keys"};
    option (google.api.method_signature) = "space_id";
  }

  // Revokes a specific API key's grant to access a workspace (admin/owner only).
  rpc RevokeSpaceAPIKeyGrant(RevokeSpaceAPIKeyGrantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/spaces/{space_id}/api-keys/{api_key_id}"};
    option (google.api.method_signature) = "space_id,api_key_id";
  }

  // Creates a workspace-scoped OAuth 2.1 client (admin/owner only).
  rpc CreateSpaceOAuthClient(CreateSpaceOAuthClientRequest) returns (SpaceOAuthClient) {
    option (google.api.http) = {
      post: "/v1/spaces/{space_id}/oauth-clients"
      body: "oauth_client"
    };
    option (google.api.method_signature) = "space_id,oauth_client";
  }

  // Retrieves a workspace-scoped OAuth 2.1 client (admin/owner only).
  rpc GetSpaceOAuthClient(GetSpaceOAuthClientRequest) returns (SpaceOAuthClient) {
    option (google.api.http) = {get: "/v1/spaces/{space_id}/oauth-clients/{client_id}"};
    option (google.api.method_signature) = "space_id,client_id";
  }

  // Lists workspace-scoped OAuth 2.1 clients (admin/owner only).
  rpc ListSpaceOAuthClients(ListSpaceOAuthClientsRequest) returns (ListSpaceOAuthClientsResponse) {
    option (google.api.http) = {get: "/v1/spaces/{space_id}/oauth-clients"};
    option (google.api.method_signature) = "space_id";
  }

  // Updates a workspace-scoped OAuth 2.1 client (admin/owner only).
  rpc UpdateSpaceOAuthClient(UpdateSpaceOAuthClientRequest) returns (SpaceOAuthClient) {
    option (google.api.http) = {
      patch: "/v1/spaces/{space_id}/oauth-clients/{client_id}"
      body: "oauth_client"
    };
    option (google.api.method_signature) = "space_id,client_id,oauth_client,update_mask";
  }

  // Rotates the secret for a confidential workspace-scoped OAuth 2.1 client (admin/owner only).
  rpc RotateSpaceOAuthClientSecret(RotateSpaceOAuthClientSecretRequest) returns (SpaceOAuthClient) {
    option (google.api.http) = {
      post: "/v1/spaces/{space_id}/oauth-clients/{client_id}:rotate-secret"
      body: "*"
    };
    option (google.api.method_signature) = "space_id,client_id";
  }

  // Deletes a workspace-scoped OAuth 2.1 client (admin/owner only).
  rpc DeleteSpaceOAuthClient(DeleteSpaceOAuthClientRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/spaces/{space_id}/oauth-clients/{client_id}"};
    option (google.api.method_signature) = "space_id,client_id";
  }

  // Lists all active OAuth 2.1 grants targeting a workspace (admin/owner only).
  rpc ListSpaceOAuthGrants(ListSpaceOAuthGrantsRequest) returns (ListSpaceOAuthGrantsResponse) {
    option (google.api.http) = {get: "/v1/spaces/{space_id}/oauth-grants"};
    option (google.api.method_signature) = "space_id";
  }

  // Revokes a user's OAuth 2.1 grant targeting a workspace (admin/owner only).
  rpc RevokeSpaceOAuthGrant(RevokeSpaceOAuthGrantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/spaces/{space_id}/oauth-grants/{grant_id}"};
    option (google.api.method_signature) = "space_id,grant_id";
  }
}

// Space represents a workspace resource.
message Space {
  // Output only. The workspace's unique identifier.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The workspace's display name.
  string name = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. A user-provided description of the workspace.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The user identifier of the workspace owner.
  // Formatted as `usr_<ksuid>` (e.g., `usr_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string owner_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The optimistic concurrency control version number.
  int64 version = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the workspace was created.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the workspace was last updated.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// SpaceMember represents a member of a workspace.
message SpaceMember {
  // Role defines the member's role and permissions within a workspace.
  enum Role {
    // Default unspecified role.
    ROLE_UNSPECIFIED = 0;

    // Workspace owner with full administrative and billing control.
    OWNER = 1;

    // Workspace administrator with member management and settings access.
    ADMIN = 2;

    // Standard workspace member with regular read and write access.
    MEMBER = 3;

    // Workspace viewer with read-only access.
    VIEWER = 4;
  }

  // Output only. The unique identifier of the workspace this member belongs to.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The user identifier of the member.
  // Formatted as `usr_<ksuid>` (e.g., `usr_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string user_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Required. The member's role within the workspace.
  Role role = 3 [(google.api.field_behavior) = REQUIRED];

  // Output only. The timestamp when the member joined the workspace.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the member's details or role were last updated.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The nested user profile details.
  message Profile {
    // Output only. The member's full or display name.
    string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The member's username.
    string username = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The URL to the member's profile avatar image.
    string avatar_url = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Output only. The member's user profile details.
  Profile profile = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Spaces.CreateSpace.
message CreateSpaceRequest {
  // Required. The workspace's display name.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. A user-provided description of the workspace.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Spaces.GetSpace.
message GetSpaceRequest {
  // Required. The unique identifier of the workspace to retrieve.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for Spaces.UpdateSpace.
message UpdateSpaceRequest {
  // Required. The unique identifier of the workspace to update.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The workspace resource with updated values.
  Space space = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  // A mask specifying which fields (e.g. `name`, `description`) in the `space`
  // field should be updated. This mask is relative to the `space` field, not to
  // the request message. The wildcard (*) path is currently not supported.
  // Currently UpdateSpace is only supported for the following fields:
  //
  // * `name`
  // * `description`
  //
  // If an unsupported field is set in `update_mask`, it will return an
  // INVALID_ARGUMENT error.
  google.protobuf.FieldMask update_mask = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. The optimistic concurrency control version expected for this update.
  optional int64 version = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Spaces.DeleteSpace.
message DeleteSpaceRequest {
  // Required. The unique identifier of the workspace to delete.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for Spaces.ListSpaces.
message ListSpacesRequest {
  // Optional. The maximum number of spaces to return. The service may return fewer
  // than this value. If unspecified, at most 20 spaces are returned. The maximum
  // value is 100; values above 100 will be coerced to 100.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListSpaces` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Spaces.ListSpaces.
message ListSpacesResponse {
  // Output only. The list of requested workspaces.
  repeated Space spaces = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Spaces.CreateSpaceMember.
message CreateSpaceMemberRequest {
  // Required. The unique identifier of the workspace to add the member to.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The member resource to add to the workspace.
  SpaceMember member = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for Spaces.DeleteSpaceMember.
message DeleteSpaceMemberRequest {
  // Required. The unique identifier of the workspace to remove the member from.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The user identifier of the member to remove.
  // Formatted as `usr_<ksuid>` (e.g., `usr_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string user_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for Spaces.UpdateSpaceMember.
message UpdateSpaceMemberRequest {
  // Required. The unique identifier of the workspace containing the member.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The member resource containing updated fields.
  SpaceMember member = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. The list of fields to update.
  // A mask specifying which fields in the `member` field should be updated.
  // Currently UpdateSpaceMember only supports the following field:
  //
  // * `role`
  //
  // Setting any other field will return an INVALID_ARGUMENT error.
  optional google.protobuf.FieldMask update_mask = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Spaces.ListSpaceMembers.
message ListSpaceMembersRequest {
  // Required. The unique identifier of the workspace whose members are listed.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The maximum number of members to return. The service may return fewer
  // than this value. If unspecified, at most 20 members are returned. The maximum
  // value is 100; values above 100 will be coerced to 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListSpaceMembers` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Spaces.ListSpaceMembers.
message ListSpaceMembersResponse {
  // Output only. The list of workspace members.
  repeated SpaceMember members = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Settings represents workspace-level configuration.
message Settings {
  // Output only. The workspace's unique identifier.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The IANA timezone identifier for the workspace (e.g. "America/Santo_Domingo", "UTC").
  // If unspecified or empty, defaults to "UTC".
  string timezone = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The optimistic concurrency control version number.
  int64 version = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the settings were created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the settings were last updated.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Spaces.GetSettings.
message GetSettingsRequest {
  // Required. The unique identifier of the workspace whose settings are retrieved.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for Spaces.UpdateSettings.
message UpdateSettingsRequest {
  // Required. The unique identifier of the workspace whose settings are updated.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The settings resource containing updated values.
  Settings settings = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  // A mask specifying which fields (e.g. `timezone`) in the `settings` field should be updated.
  google.protobuf.FieldMask update_mask = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. The optimistic concurrency control version expected for this update.
  optional int64 version = 4 [(google.api.field_behavior) = OPTIONAL];
}

// DashboardPreferences represents a user's customizable dashboard widget layout within a workspace.
message DashboardPreferences {
  // Output only. The workspace's unique identifier.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The user's unique identifier.
  // Formatted as `usr_<ksuid>` (e.g., `usr_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string user_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Ordered list of enabled dashboard widget identifiers.
  repeated string widgets = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The optimistic concurrency control version number.
  int64 version = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the dashboard preferences were created.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp when the dashboard preferences were last updated.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Spaces.GetDashboardPreferences.
message GetDashboardPreferencesRequest {
  // Required. The unique identifier of the workspace whose dashboard preferences are retrieved.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for Spaces.UpdateDashboardPreferences.
message UpdateDashboardPreferencesRequest {
  // Required. The unique identifier of the workspace whose dashboard preferences are updated.
  // Formatted as `spc_<ksuid>` (e.g., `spc_01H7B6K5Z8A3QW9J4C2N6P0Y1R`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The dashboard preferences resource containing updated values.
  DashboardPreferences dashboard_preferences = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  // A mask specifying which fields (e.g. `widgets`) in the `dashboard_preferences` field should be updated.
  google.protobuf.FieldMask update_mask = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. The optimistic concurrency control version expected for this update.
  optional int64 version = 4 [(google.api.field_behavior) = OPTIONAL];
}

// APIKeyGrant represents an API key access grant scoped to a specific workspace.
message APIKeyGrant {
  // Output only. The unique identifier of the API key (`apk_...`).
  string api_key_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The unique identifier of the granted workspace (`spc_...`).
  string space_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The user identifier of the API key owner (`usr_...`).
  string user_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The display name of the API key owner.
  string user_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The email address of the API key owner.
  string user_email = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The display name of the API key.
  string key_name = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. First 12 characters of the raw token (e.g., `sat_9xQ4kL2m`).
  string key_prefix = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Declarative permission scopes granted to the API key.
  repeated string scopes = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp after which the API key expires, if set.
  optional google.protobuf.Timestamp expires_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when the API key was last used.
  optional google.protobuf.Timestamp last_used_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when the grant to this workspace was created.
  google.protobuf.Timestamp grant_create_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Spaces.ListSpaceAPIKeyGrants.
message ListSpaceAPIKeyGrantsRequest {
  // Required. The unique identifier of the workspace whose API key grants are listed.
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for Spaces.ListSpaceAPIKeyGrants.
message ListSpaceAPIKeyGrantsResponse {
  // Output only. List of active API key grants for this workspace.
  repeated APIKeyGrant grants = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for Spaces.RevokeSpaceAPIKeyGrant.
message RevokeSpaceAPIKeyGrantRequest {
  // Required. The unique identifier of the workspace (`spc_...`).
  string space_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The unique identifier of the API key (`apk_...`) whose workspace access is revoked.
  string api_key_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// SpaceOAuthClient represents a workspace-scoped OAuth 2.1 client resource.
message SpaceOAuthClient {
  // Output only. The unique identifier of the OAuth client (`oac_<ksuid>`).
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The workspace identifier (`spc_<ksuid>`).
  string space_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Display name for the OAuth application.
  string name = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. Description of the OAuth application.
  string description = 4 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Display prefix of the client secret when confidential.
  string secret_prefix = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Full client secret (`sat_ocs_...`). Populated once on create or secret rotation.
  string raw_secret = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Registered redirect URI rules.
  repeated string redirect_uris = 7 [(google.api.field_behavior) = REQUIRED];

  // Required. Maximum scope ceiling permitted for grants issued to this client.
  repeated string allowed_scopes = 8 [(google.api.field_behavior) = REQUIRED];

  // Optional. Token endpoint client auth method (`client_secret_basic`, `client_secret_post`, `none`).
  string token_endpoint_auth_method = 9 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Refresh token policy (`rotate` or `persistent`).
  string refresh_token_policy = 10 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Registration source (`space` or `dcr`).
