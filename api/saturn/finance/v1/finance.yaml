    - selector: "saturn.finance.v1.Finance.UpdateRecurringTransaction"
      auth_required: true
      api_key_scopes: [finance:write]
    - selector: "saturn.finance.v1.Finance.DeleteRecurringTransaction"
      auth_required: true
      api_key_scopes: [finance:write]
    - selector: "saturn.finance.v1.Finance.ConfirmScheduledTransaction"
      auth_required: true
      api_key_scopes: [finance:write]
    - selector: "saturn.finance.v1.Finance.MatchScheduledTransaction"
