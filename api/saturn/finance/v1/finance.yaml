# Finance service API configuration.
#
# All finance endpoints require JWT Bearer authentication.
# Workspace authorization is scoped via the request payload.

name: saturn.finance.v1
title: "Saturn Finance API"
apis:
  - saturn.finance.v1.Finance

documentation:
  summary: "Provides budgeting and currency configurations for a workspace."

authentication:
  rules:
    # All finance endpoints require authentication
    - selector: "saturn.finance.v1.Finance.*"
      auth_required: true
    # Read RPCs (allowed with finance:read or finance:write)
    - selector: "saturn.finance.v1.Finance.GetSettings"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.GetBudget"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListBudgets"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.GetBudgetPeriod"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.GetExchangeRate"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListExchangeRates"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListTransactions"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.GetTransaction"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListTransactionEvents"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.GetInsights"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListRecurringTransactions"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListScheduledTransactions"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.GetScheduledTransaction"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.GetBorrowing"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListBorrowings"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.GetAccount"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListAccounts"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListInstitutions"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ResolveInstitution"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListTransfers"
      auth_required: true
      api_key_scopes: [finance:read, finance:write]
    - selector: "saturn.finance.v1.Finance.ListCurrencies"
      auth_required: true
