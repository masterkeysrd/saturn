message GetStatementRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to delete a statement.
message DeleteStatementRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  optional int64 version = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request to list statements in a space.
message ListStatementsRequest {
  // Optional. Filter statements by account identifier.
  optional string account_id = 1 [(google.api.field_behavior) = OPTIONAL];
  // Optional. Filter statements by status.
  optional Statement.Status status = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional. Number of statements to return.
  int32 page_size = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional. Keyset pagination token.
  string page_token = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response from listing statements.
message ListStatementsResponse {
