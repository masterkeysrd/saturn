syntax = "proto3";

package saturn.finance.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "saturn/platform/scheduler/v1/options.proto";

option go_package = "github.com/masterkeysrd/saturn/apis/saturn/finance/v1;financev1";

// Finance service provides APIs for budgeting, accounts management, transaction
// recording, daily exchange rate configurations, and analytics insights.
service Finance {
  // Configures the base currency of a space. The base currency acts as the unified
  // currency in which financial insights and multi-currency conversions are performed.
  rpc ConfigureFinance(ConfigureFinanceRequest) returns (FinanceSettings) {
    option (google.api.http) = {
      post: "/v1/finance/settings"
      body: "*"
    };
  }

  // Retrieves the current finance settings, including the configured base currency.
  rpc GetFinanceSettings(GetFinanceSettingsRequest) returns (FinanceSettings) {
    option (google.api.http) = {get: "/v1/finance/settings"};
  }

  // Creates a budget category template. Budgets track spent thresholds over repeating intervals.
  rpc CreateBudget(CreateBudgetRequest) returns (Budget) {
    option (google.api.http) = {
      post: "/v1/finance/budgets"
      body: "budget"
    };
  }

  // Retrieves details of a specific budget category template.
  rpc GetBudget(GetBudgetRequest) returns (Budget) {
    option (google.api.http) = {get: "/v1/finance/budgets/{id}"};
  }

  // Updates an existing budget template's properties, such as visual parameters or limit propagation policies.
  rpc UpdateBudget(UpdateBudgetRequest) returns (Budget) {
    option (google.api.http) = {
      put: "/v1/finance/budgets/{id}"
      body: "budget"
    };
  }

  // Deletes a budget template. Only inactive budgets or budgets without active transactions can be deleted.
  rpc DeleteBudget(DeleteBudgetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/budgets/{id}"};
  }

  // Lists budget templates inside the space, supporting paginated, sorted, and text-based filter views.
  rpc ListBudgets(ListBudgetsRequest) returns (ListBudgetsResponse) {
    option (google.api.http) = {get: "/v1/finance/budgets"};
  }

  // Retrieves or automatically spawns the active budget period containing current spend limits for a target date.
  rpc GetBudgetPeriod(GetBudgetPeriodRequest) returns (BudgetPeriod) {
    option (google.api.http) = {get: "/v1/finance/budgets/{budget_id}/period"};
  }

  // Registers a daily exchange rate conversion coefficient between two currencies.
  rpc CreateExchangeRate(CreateExchangeRateRequest) returns (ExchangeRate) {
    option (google.api.http) = {
      post: "/v1/finance/exchange-rates"
      body: "exchange_rate"
    };
  }

  // Retrieves a specific daily exchange rate conversion rule by ID.
  rpc GetExchangeRate(GetExchangeRateRequest) returns (ExchangeRate) {
    option (google.api.http) = {get: "/v1/finance/exchange-rates/{id}"};
  }

  // Updates an existing daily exchange rate conversion coefficient.
  rpc UpdateExchangeRate(UpdateExchangeRateRequest) returns (ExchangeRate) {
    option (google.api.http) = {
      put: "/v1/finance/exchange-rates/{id}"
      body: "exchange_rate"
    };
  }

  // Lists historical exchange rate conversion coefficients.
  rpc ListExchangeRates(ListExchangeRatesRequest) returns (ListExchangeRatesResponse) {
    option (google.api.http) = {get: "/v1/finance/exchange-rates"};
  }

  // Deletes a registered daily exchange rate conversion rule.
  rpc DeleteExchangeRate(DeleteExchangeRateRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/exchange-rates/{id}"};
  }

  // Logs a new expense transaction, updating target budget periods and reducing account balances.
  rpc CreateExpense(CreateExpenseRequest) returns (Transaction) {
    option (google.api.http) = {
      post: "/v1/finance/expenses"
      body: "*"
    };
  }

  // Modifies properties of a logged expense transaction. Re-calculates budget and currency conversions.
  rpc UpdateExpense(UpdateExpenseRequest) returns (Transaction) {
    option (google.api.http) = {
      put: "/v1/finance/expenses/{id}"
      body: "*"
    };
  }

  // Deletes a transaction, reversing all changes to budget period consumption and account balances.
  rpc DeleteTransaction(DeleteTransactionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/transactions/{id}"};
  }

  // Lists paginated transaction records matching specific budget, account, source, or text queries.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = {get: "/v1/finance/transactions"};
  }

  // Lists historical lifecycle events tracking mutations and updates applied to a transaction.
  rpc ListTransactionEvents(ListTransactionEventsRequest) returns (ListTransactionEventsResponse) {
    option (google.api.http) = {get: "/v1/finance/transactions/{txn_id}/events"};
  }

  // Aggregates space spend patterns, limits, remaining budgets, burn rates, and budget category distributions.
  rpc GetInsights(GetInsightsRequest) returns (GetInsightsResponse) {
    option (google.api.http) = {get: "/v1/finance/insights"};
  }

  // Registers a recurring expense template, generating repeating payment obligations periodically.
  rpc CreateRecurringExpense(CreateRecurringExpenseRequest) returns (RecurringExpense) {
    option (google.api.http) = {
      post: "/v1/finance/recurring-expenses"
      body: "recurring_expense"
    };
  }

  // Updates an active recurring expense template.
  rpc UpdateRecurringExpense(UpdateRecurringExpenseRequest) returns (RecurringExpense) {
    option (google.api.http) = {
      put: "/v1/finance/recurring-expenses/{id}"
      body: "recurring_expense"
    };
  }

  // Deletes a recurring template, preventing any future payment instances from spawning.
  rpc DeleteRecurringExpense(DeleteRecurringExpenseRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/recurring-expenses/{id}"};
  }

  // Lists all configured recurring templates in the space.
  rpc ListRecurringExpenses(ListRecurringExpensesRequest) returns (ListRecurringExpensesResponse) {
    option (google.api.http) = {get: "/v1/finance/recurring-expenses"};
  }

  // Lists scheduled payment instances spawned by recurring templates.
  rpc ListScheduledPayments(ListScheduledPaymentsRequest) returns (ListScheduledPaymentsResponse) {
    option (google.api.http) = {get: "/v1/finance/scheduled-payments"};
  }

  // Clears a scheduled payment instance, converting it into a permanent, reconciled ledger transaction.
  rpc ConfirmScheduledPayment(ConfirmScheduledPaymentRequest) returns (Transaction) {
    option (google.api.http) = {
      post: "/v1/finance/scheduled-payments/{payment_id}/confirm"
      body: "*"
    };
  }

  // Links an existing transaction with a pending scheduled payment, marking it cleared.
  rpc MatchScheduledPayment(MatchScheduledPaymentRequest) returns (Transaction) {
    option (google.api.http) = {
      post: "/v1/finance/scheduled-payments/{payment_id}/match"
      body: "*"
    };
  }

  // Logs a new personal debt agreement (lent or borrowed money).
  rpc CreateBorrowing(CreateBorrowingRequest) returns (Borrowing) {
    option (google.api.http) = {
      post: "/v1/finance/borrowings"
      body: "borrowing"
    };
  }

  // Retrieves detail metrics of a borrowing record.
  rpc GetBorrowing(GetBorrowingRequest) returns (Borrowing) {
    option (google.api.http) = {get: "/v1/finance/borrowings/{id}"};
  }

  // Lists active or paid-off personal debt agreements.
  rpc ListBorrowings(ListBorrowingsRequest) returns (ListBorrowingsResponse) {
    option (google.api.http) = {get: "/v1/finance/borrowings"};
  }

  // Updates properties of a borrowing record (such as counterparty contact details).
  rpc UpdateBorrowing(UpdateBorrowingRequest) returns (Borrowing) {
    option (google.api.http) = {
      put: "/v1/finance/borrowings/{id}"
      body: "borrowing"
    };
  }

  // Deletes a borrowing record and all corresponding repayments.
  rpc DeleteBorrowing(DeleteBorrowingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/borrowings/{id}"};
  }

  // Logs a repayment installment reducing the remaining amount of an active debt agreement.
  rpc CreateBorrowingRepayment(CreateBorrowingRepaymentRequest) returns (BorrowingRepayment) {
    option (google.api.http) = {
      post: "/v1/finance/borrowings/{borrowing_id}/repayments"
      body: "repayment"
    };
  }

  // Lists all repayment installments registered under a debt agreement.
  rpc ListBorrowingRepayments(ListBorrowingRepaymentsRequest) returns (ListBorrowingRepaymentsResponse) {
    option (google.api.http) = {get: "/v1/finance/borrowings/{borrowing_id}/repayments"};
  }

  // Deletes a borrowing repayment, restoring the debt balance of the borrowing agreement.
  rpc DeleteBorrowingRepayment(DeleteBorrowingRepaymentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/borrowings/{borrowing_id}/repayments/{id}"};
  }

  // Registers a new payment or liquidity account (such as cash, bank, or credit card).
  rpc CreateAccount(CreateAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1/finance/accounts"
      body: "account"
    };
  }

  // Retrieves details of a specific payment account.
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {get: "/v1/finance/accounts/{id}"};
  }

  // Updates details of a payment account (such as notes, active flags, or default overrides).
  rpc UpdateAccount(UpdateAccountRequest) returns (Account) {
    option (google.api.http) = {
      put: "/v1/finance/accounts/{id}"
      body: "account"
    };
  }

  // Deletes a payment account. Default accounts cannot be deleted until another default is nominated.
  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/accounts/{id}"};
  }

  // Lists payment accounts in the workspace, supporting optional currency conversion hydration.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/v1/finance/accounts"};
  }

  // Logs a transfer transaction, shifting funds between a source and destination account.
  rpc CreateTransfer(CreateTransferRequest) returns (Transfer) {
    option (google.api.http) = {
      post: "/v1/finance/transfers"
      body: "*"
    };
  }

  // Lists all transfer transactions registered in the workspace.
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse) {
    option (google.api.http) = {get: "/v1/finance/transfers"};
  }

  // Retrieves a static list of supported currencies.
  rpc ListCurrencies(ListCurrenciesRequest) returns (ListCurrenciesResponse) {
    option (google.api.http) = {get: "/v1/finance/currencies"};
  }

  // Lists staging inbox items queue awaiting manual approval or transaction matching.
  rpc ListInboxItems(ListInboxItemsRequest) returns (ListInboxItemsResponse) {
    option (google.api.http) = {get: "/v1/finance/inbox-items"};
  }

  // Updates a staged inbox item's draft properties.
  rpc UpdateInboxItem(UpdateInboxItemRequest) returns (InboxItem) {
    option (google.api.http) = {
      put: "/v1/finance/inbox-items/{id}"
      body: "inbox_item"
    };
  }

  // Approves and promotes an ingested inbox item.
  rpc ApproveInboxItem(ApproveInboxItemRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/finance/inbox-items/{id}:approve"
      body: "*"
    };
  }

  // Discards an ingested inbox item from the staging queue, preventing classification.
  rpc DiscardInboxItem(DiscardInboxItemRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/inbox-items/{id}"};
  }
}

// FinanceSettings represents the workspace configuration.
message FinanceSettings {
  // Output only. Associated space identifier.
  string space_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Base currency for conversions and insights (e.g. "USD").
  // Analytics calculations and overall spend views default to this currency.
  string base_currency = 2 [(google.api.field_behavior) = REQUIRED];

  // Output only. Creation time of the settings.
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Last update time of the settings.
  google.protobuf.Timestamp update_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Budget represents a budget template definition.
message Budget {
  // RecurrenceInterval defines the frequency of budgeting or transaction execution rules.
  enum RecurrenceInterval {
    // Default unspecified value. Invalid fallback.
    RECURRENCE_INTERVAL_UNSPECIFIED = 0;
    // Budget resets or templates trigger every calendar week.
    WEEKLY = 1;
    // Budget resets or templates trigger every calendar month.
    MONTHLY = 2;
    // Budget resets or templates trigger every calendar year.
    YEARLY = 3;
  }

  // Scoped resource view options.
  enum View {
    // Default view. Resolves only basic configuration fields.
    VIEW_UNSPECIFIED = 0;
    // Returns basic configuration details without period calculations.
    BASIC = 1;
    // Hydrates complete structure including active period spent statistics.
    FULL = 2;
  }

  // Represents the computed details of the active/current period.
  message ActivePeriod {
    // Output only. Start date boundary of the current period.
    google.protobuf.Timestamp start_date = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. End date boundary of the current period.
    google.protobuf.Timestamp end_date = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Amount spent in local currency cents within this period.
    int64 spent_amount = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Amount spent converted to base currency cents.
    int64 spent_in_base = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Exchange rate to base currency used during conversion.
    double exchange_rate_to_base = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Base currency identifier.
    string base_currency = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Limit in base currency cents.
    int64 limit_in_base = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Output only. Budget template identifier.
  // Values are of the form `bud_[a-zA-Z0-9]+`.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Space identifier.
  string space_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. User-friendly name of the budget template.
  string name = 3 [(google.api.field_behavior) = REQUIRED];

  // Required. Limit amount in cents (e.g. 50000 for $500.00).
  int64 limit_amount = 4 [(google.api.field_behavior) = REQUIRED];

  // Required. ISO Currency code of the budget limit.
  string currency = 5 [(google.api.field_behavior) = REQUIRED];

  // Required. Recurrence interval frequency.
  RecurrenceInterval interval = 6 [(google.api.field_behavior) = REQUIRED];

  // Optional. Indicates if the budget is active and accepting transaction logging.
  bool is_active = 7 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Icon identifier for UI rendering.
  string icon = 8 [(google.api.field_behavior) = OPTIONAL];

  // Optional. HEX Color code for UI categorization.
  string color = 9 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Default payment/liquidity account associated with this budget.
  // Values are of the form `acc_[a-zA-Z0-9]+`.
  optional string default_account_id = 10 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Metrics of the current budget period.
  ActivePeriod current_period = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Creation time of the budget.
  google.protobuf.Timestamp create_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Last update time of the budget.
  google.protobuf.Timestamp update_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// BudgetPeriod represents an active instantiation of a budget.
message BudgetPeriod {
  // Output only. Period identifier.
  // Values are of the form `per_[a-zA-Z0-9]+`.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Parent budget template identifier.
  // Values are of the form `bud_[a-zA-Z0-9]+`.
  string budget_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Space identifier.
  string space_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Period start date.
  google.protobuf.Timestamp start_date = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Period end date.
  google.protobuf.Timestamp end_date = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Limit amount allocated to this period in local currency cents.
  int64 limit_amount = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Local currency code.
  string currency = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Workspace base currency code.
  string base_currency = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Exchange rate to base currency used during conversion.
  double exchange_rate_to_base = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Creation time of the budget period.
  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Last update time of the budget period.
  google.protobuf.Timestamp update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Spent amount in cents within this period.
  int64 spent_amount = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Spent amount converted to base currency cents.
  int64 spent_in_base = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request for
// [ConfigureFinance][saturn.finance.v1.Finance.ConfigureFinance].
message ConfigureFinanceRequest {
  // Required. Base currency for conversions and insights (e.g. "USD").
  // Conversions and aggregated spent statistics will default to this currency.
  string base_currency = 1 [(google.api.field_behavior) = REQUIRED];
}

// The request for
// [GetFinanceSettings][saturn.finance.v1.Finance.GetFinanceSettings].
message GetFinanceSettingsRequest {}

// The request for
// [GetBudget][saturn.finance.v1.Finance.GetBudget].
message GetBudgetRequest {
  // Required. Unique identifier of the budget template to retrieve.
  // Values are of the form `bud_[a-zA-Z0-9]+`.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// The request for
// [CreateBudget][saturn.finance.v1.Finance.CreateBudget].
message CreateBudgetRequest {
  // Required. Target budget template parameters.
  Budget budget = 1 [(google.api.field_behavior) = REQUIRED];
}

// LimitPropagation defines how changes in budget limits propagate to future periods.
enum LimitPropagation {
  // Default unspecified value.
  LIMIT_PROPAGATION_UNSPECIFIED = 0;
  // Apply the limit modification only to the current active period.
  LIMIT_PROPAGATION_CURRENT_PERIOD = 1;
  // Propagate limits to all future budget periods without modifying history.
  LIMIT_PROPAGATION_NEXT_PERIODS_ONLY = 2;
}

// The request for
// [UpdateBudget][saturn.finance.v1.Finance.UpdateBudget].
message UpdateBudgetRequest {
  // Required. ID of the budget to update.
  // Values are of the form `bud_[a-zA-Z0-9]+`.
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Updated budget template parameters.
  Budget budget = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. Limit propagation logic determining how future periods are affected.
  LimitPropagation propagation = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The request for
// [DeleteBudget][saturn.finance.v1.Finance.DeleteBudget].
message DeleteBudgetRequest {
  // Required. ID of the budget to delete.
  // Values are of the form `bud_[a-zA-Z0-9]+`.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// The request for
// [ListBudgets][saturn.finance.v1.Finance.ListBudgets].
message ListBudgetsRequest {
  // Optional. Maximum number of items to return in a single page.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Keyset page token returned by a previous call.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filter only active budgets.
  optional bool active_only = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Text search query matching budget names.
  optional string search_query = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Sorting rules specifying field name and optional ordering suffix.
  optional string sort = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Scoped budget representation view type.
  optional Budget.View view = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Specific calculation target date for periods. Defaults to current time if omitted.
  optional google.protobuf.Timestamp target_date = 7 [(google.api.field_behavior) = OPTIONAL];
}

// The response for
// [ListBudgets][saturn.finance.v1.Finance.ListBudgets].
message ListBudgetsResponse {
  // List of budgets matching filter rules.
  repeated Budget budgets = 1;

  // Keyset token to fetch the next page of results. Empty if no more pages are available.
  string next_page_token = 2;
}

// The request for
// [GetBudgetPeriod][saturn.finance.v1.Finance.GetBudgetPeriod].
message GetBudgetPeriodRequest {
  // Required. Target parent budget ID.
  // Values are of the form `bud_[a-zA-Z0-9]+`.
  string budget_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Target calculation date, defaults to current time if omitted.
  google.protobuf.Timestamp date = 2 [(google.api.field_behavior) = OPTIONAL];
}

// ExchangeRate represents a daily rate record.
message ExchangeRate {
  // Output only. Unique resource identifier (e.g. "rate_USD_EUR_20260727").
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Associated space identifier.
  string space_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Source currency code (e.g. "EUR").
  string from_currency = 3 [(google.api.field_behavior) = REQUIRED];

  // Required. Target currency code (e.g. "USD").
  string to_currency = 4 [(google.api.field_behavior) = REQUIRED];

  // Required. Conversion rate multiplier (e.g. 1.12).
  double rate = 5 [(google.api.field_behavior) = REQUIRED];

  // Required. Target date for this rate.
  google.protobuf.Timestamp rate_date = 6 [(google.api.field_behavior) = REQUIRED];

  // Output only. Record creation timestamp.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request for
// [CreateExchangeRate][saturn.finance.v1.Finance.CreateExchangeRate].
message CreateExchangeRateRequest {
  // Required. The exchange rate resource to create.
  ExchangeRate exchange_rate = 1 [(google.api.field_behavior) = REQUIRED];
}

// The request for
// [GetExchangeRate][saturn.finance.v1.Finance.GetExchangeRate].
message GetExchangeRateRequest {
  // Required. Unique identifier of the exchange rate (e.g. "rate_USD_EUR_20260727").
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// The request for
// [UpdateExchangeRate][saturn.finance.v1.Finance.UpdateExchangeRate].
message UpdateExchangeRateRequest {
  // Required. Unique identifier of the exchange rate to update.
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The exchange rate details to update.
  ExchangeRate exchange_rate = 2 [(google.api.field_behavior) = REQUIRED];
}

// The request for
// [ListExchangeRates][saturn.finance.v1.Finance.ListExchangeRates].
message ListExchangeRatesRequest {
  // Optional. Maximum number of items to return.
  optional int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Keyset page token.
  optional string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Source currency code to filter by (e.g. "EUR").
  optional string from_currency = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Target currency code to filter by (e.g. "USD").
  optional string to_currency = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Start boundary date (inclusive) for rate_date filter.
  optional google.protobuf.Timestamp start_date = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. End boundary date (inclusive) for rate_date filter.
  optional google.protobuf.Timestamp end_date = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Sort order for results (e.g. "rate_date desc", "from_currency asc").
  optional string order_by = 7 [(google.api.field_behavior) = OPTIONAL];
}

// The response for
// [ListExchangeRates][saturn.finance.v1.Finance.ListExchangeRates].
message ListExchangeRatesResponse {
  // List of matching exchange rate records.
  repeated ExchangeRate exchange_rates = 1;

  // Keyset token to fetch the next page of results. Empty if no more pages are available.
  string next_page_token = 2;
}

// The request for
// [DeleteExchangeRate][saturn.finance.v1.Finance.DeleteExchangeRate].
message DeleteExchangeRateRequest {
  // Required. Unique identifier of the exchange rate to delete (e.g. "rate_USD_EUR_20260727").
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Transaction represents a financial record in the space ledger.
message Transaction {
  // Type defines the direction and flow of funds.
  enum Type {
    // Default unspecified type.
    TYPE_UNSPECIFIED = 0;
    // Expense transaction, subtracting from the account balance.
    EXPENSE = 1;
    // Income transaction, adding to the account balance.
    INCOME = 2;
