name: Release Mobile Apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target release tag to attach binaries to (e.g. mobile/v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && (
        startsWith(github.event.release.tag_name, 'mobile/') ||
        startsWith(github.event.release.tag_name, 'mobile-')
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: npx turbo run build --filter="@saturn/*"

      - name: Prebuild Android native project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile

      - name: Build Android Release APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK (Self-Signed for Direct Sideloading)
        run: |
          KEYSTORE="saturn-release.keystore"
          keytool -genkeypair -v -keystore $KEYSTORE -alias saturn -keyalg RSA -keysize 2048 -validity 10000 -storepass saturnpass -keypass saturnpass -dname "CN=Saturn, OU=Mobile, O=Masterkeys, L=Local, S=Local, C=US"
          
          # Find the generated APK
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at $APK_PATH"
          
          # Align and sign using Android build-tools apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_PATH" "apps/mobile/saturn-aligned.apk" || cp "$APK_PATH" "apps/mobile/saturn-aligned.apk"
          $BUILD_TOOLS_DIR/apksigner sign --ks $KEYSTORE --ks-pass pass:saturnpass --out "apps/mobile/saturn.apk" "apps/mobile/saturn-aligned.apk"
          
          echo "Signed APK ready at apps/mobile/saturn.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: saturn-android-apk
          path: apps/mobile/saturn.apk
          if-no-files-found: error

  build-ios-simulator:
    name: Build iOS Simulator App
    runs-on: macos-26
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && (
        startsWith(github.event.release.tag_name, 'mobile/') ||
        startsWith(github.event.release.tag_name, 'mobile-')
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: npx turbo run build --filter="@saturn/*"

      - name: Prebuild iOS native project
        run: npx expo prebuild --platform ios --no-install
        working-directory: apps/mobile

      - name: Install CocoaPods
        run: |
          cd apps/mobile/ios
          pod install

      - name: Build iOS Simulator Archive
        run: |
          cd apps/mobile/ios
          xcodebuild -workspace Saturn.xcworkspace \
            -scheme Saturn \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

          # Compress the .app bundle
          cd build/Build/Products/Release-iphonesimulator
          zip -r ../../../../saturn-ios-simulator.zip Saturn.app

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v7
        with:
          name: saturn-ios-simulator
          path: apps/mobile/saturn-ios-simulator.zip
          if-no-files-found: error

  publish-release:
    name: Attach Binaries to Release
    needs: [build-android, build-ios-simulator]
    runs-on: ubuntu-latest
    if: always() && needs.build-android.result == 'success' && needs.build-ios-simulator.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: saturn-android-apk
          path: ./release-assets

      - name: Download iOS Simulator Build
        uses: actions/download-artifact@v8
        with:
          name: saturn-ios-simulator
          path: ./release-assets

      - name: Upload Binaries to Existing Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "Error: Could not determine release tag name."
            exit 1
          fi

          echo "Target Release Tag: $TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Found existing release $TAG_NAME. Uploading assets..."
            gh release upload "$TAG_NAME" \
              ./release-assets/saturn.apk \
              ./release-assets/saturn-ios-simulator.zip \
              --clobber
          else
            echo "Release $TAG_NAME does not exist. Creating release..."
            gh release create "$TAG_NAME" \
              ./release-assets/saturn.apk \
              ./release-assets/saturn-ios-simulator.zip \
              --title "$TAG_NAME" \
              --generate-notes
          fi
