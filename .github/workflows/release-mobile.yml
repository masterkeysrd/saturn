name: Release Mobile Apps

on:
  push:
    tags:
      - "mobile/*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Target release tag to attach binaries to (e.g. mobile/v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: npx turbo run build --filter="@saturn/*"

      - name: Prebuild Android native project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android Release APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="saturn-release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding persistent Android release keystore from secret..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            KS_ALIAS="${ANDROID_KEY_ALIAS:-saturn}"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            if [ -z "$KS_PASS" ]; then
              echo "::error::ANDROID_KEYSTORE_PASSWORD secret is required when ANDROID_KEYSTORE_BASE64 is set."
              exit 1
            fi
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not configured; generating an ephemeral self-signed keystore (existing users cannot upgrade without uninstalling)."
            KS_ALIAS="saturn"
            KS_PASS="saturnpass"
            KEY_PASS="saturnpass"
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=Saturn, OU=Mobile, O=Masterkeys, L=Local, S=Local, C=US"
          fi

          # Find the generated APK
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at $APK_PATH"

          # Align and sign using Android build-tools apksigner
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$APK_PATH" "apps/mobile/saturn-aligned.apk" || cp "$APK_PATH" "apps/mobile/saturn-aligned.apk"
          KS_PASS="$KS_PASS" KEY_PASS="$KEY_PASS" "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "apps/mobile/saturn.apk" \
            "apps/mobile/saturn-aligned.apk"

          rm -f "$KEYSTORE"
          echo "Signed APK ready at apps/mobile/saturn.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: saturn-android-apk
          path: apps/mobile/saturn.apk
          if-no-files-found: error

  build-ios-simulator:
    name: Build iOS Simulator App
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: npx turbo run build --filter="@saturn/*"

      - name: Prebuild iOS native project
        run: npx expo prebuild --platform ios --no-install
        working-directory: apps/mobile

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd apps/mobile/ios
          pod install

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: apps/mobile/ios/build/Build/Intermediates.noindex
          key: ${{ runner.os }}-derived-data-${{ hashFiles('apps/mobile/package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      - name: Build iOS Simulator Archive
        run: |
          cd apps/mobile/ios
          xcodebuild -workspace Saturn.xcworkspace \
            -scheme Saturn \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

          # Find and compress the .app bundle
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in build/Build/Products"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")

          (cd "$APP_DIR" && zip -r "$GITHUB_WORKSPACE/apps/mobile/saturn-ios-simulator.zip" "$APP_NAME")
          echo "Simulator build zipped to: $GITHUB_WORKSPACE/apps/mobile/saturn-ios-simulator.zip"

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v7
        with:
          name: saturn-ios-simulator
          path: apps/mobile/saturn-ios-simulator.zip
          if-no-files-found: error

  publish-release:
    name: Attach Binaries to Release
    needs: [build-android, build-ios-simulator]
    runs-on: ubuntu-latest
    if: always() && needs.build-android.result == 'success' && needs.build-ios-simulator.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: saturn-android-apk
          path: ./release-assets

      - name: Download iOS Simulator Build
        uses: actions/download-artifact@v8
        with:
          name: saturn-ios-simulator
          path: ./release-assets

      - name: Upload Binaries to Existing Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "Error: Could not determine release tag name."
            exit 1
          fi

          echo "Target Release Tag: $TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Found existing release $TAG_NAME. Uploading assets..."
            gh release upload "$TAG_NAME" \
              ./release-assets/saturn.apk \
              ./release-assets/saturn-ios-simulator.zip \
              --clobber
          else
            echo "Release $TAG_NAME does not exist. Creating release..."
            gh release create "$TAG_NAME" \
              ./release-assets/saturn.apk \
              ./release-assets/saturn-ios-simulator.zip \
              --title "$TAG_NAME" \
              --generate-notes
          fi
