version: 2
updates:
  # 1. Keep Go modules updated weekly
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5

  # 2. Keep React web app npm dependencies updated weekly
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "UTC"
    open-pull-requests-limit: 5

  # 3. Keep GitHub Actions workflows updated weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3

  # 4. Keep Dockerfile base images updated weekly
  - package-ecosystem: "docker"
    directory: "/build/saturn"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "UTC"
    open-pull-requests-limit: 3

  # 5. Keep Docker Compose service images updated weekly
  - package-ecosystem: "docker-compose"
    directory: "/deployments/docker-compose"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
