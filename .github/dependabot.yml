version: 2
updates:
  # 1. Keep Go modules updated weekly
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5

  # 2. Keep Monorepo npm dependencies updated weekly across apps & packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      expo-mobile:
        patterns:
          - "expo*"
          - "react-native*"
      monorepo-tooling:
        patterns:
          - "turbo"
          - "prettier*"
          - "typescript"

  # 3. Keep GitHub Actions workflows updated weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3

  # 4. Keep Dockerfile base images updated weekly
  - package-ecosystem: "docker"
    directory: "/build/saturn"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "UTC"
    open-pull-requests-limit: 3
