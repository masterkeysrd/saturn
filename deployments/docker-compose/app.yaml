---
name: saturn

services:
  db:
    extends:
      file: ./postgres.yaml
      service: db

  pgweb:
    extends:
      file: ./postgres.yaml
      service: pgweb

  migrate:
    extends:
      file: ./postgres.yaml
      service: migrate

  saturn:
    build:
      context: ../..
      dockerfile: build/saturn/Dockerfile
    image: saturn:latest
    restart: unless-stopped
    ports:
       - "8080:8080"
    env_file:
      - ../../.env
    environment:
      SATURN_DB_HOST: db
      SATURN_DB_PORT: "5432"
      SATURN_DB_USER: saturn
      SATURN_DB_PASSWORD: saturn
      SATURN_DB_NAME: saturn
      SATURN_DB_SSL_MODE: disable
      SATURN_GATEWAY_ADDR: ":8080"
      SATURN_LOG_LEVEL: debug
      SATURN_SWAGGER_ENABLED: true
      SATURN_GATEWAY_COOKIE_SECURE: "false"
      SATURN_WEBHOOK_SECRET: ${SATURN_WEBHOOK_SECRET:-dev_webhook_secret}
      SATURN_SECURITY_ENCRYPTION_KEY: ${SATURN_SECURITY_ENCRYPTION_KEY:-saturn-dev-master-encryption-key-fallback}
      SATURN_AI_PROVIDERS_ALLOW_PRIVATE_NETWORKS: ${SATURN_AI_PROVIDERS_ALLOW_PRIVATE_NETWORKS:-true}
      SATURN_AI_MCP_ALLOW_PRIVATE_NETWORKS: ${SATURN_AI_MCP_ALLOW_PRIVATE_NETWORKS:-true}
      SATURN_OAUTH_ISSUER_URL: ${SATURN_OAUTH_ISSUER_URL:-}
      SATURN_OAUTH_ALLOW_DYNAMIC_REGISTRATION: ${SATURN_OAUTH_ALLOW_DYNAMIC_REGISTRATION:-true}
      SATURN_OAUTH_ACCESS_TOKEN_TTL: ${SATURN_OAUTH_ACCESS_TOKEN_TTL:-1h}
      SATURN_OAUTH_REFRESH_TOKEN_TTL: ${SATURN_OAUTH_REFRESH_TOKEN_TTL:-2160h}
      SATURN_OAUTH_ALLOW_PRIVATE_NETWORKS: ${SATURN_OAUTH_ALLOW_PRIVATE_NETWORKS:-true}
    volumes:
       - saturn-data:/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
         - action: rebuild
           path: cmd
           target: /usr/local/bin/saturn
         - action: rebuild
           path: go.mod
           target: /usr/local/bin/saturn
         - action: rebuild
           path: go.sum
           target: /usr/local/bin/saturn

volumes:
  db-data:
  saturn-data:
